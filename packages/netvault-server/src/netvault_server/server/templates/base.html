<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="{{ path_for('/static/theme.js') }}?v={{ asset_version }}"></script>
    <title>{% block title %}NetVault{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='4' width='24' height='24' rx='7' fill='%23000'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-family='Arial' font-size='12' font-weight='700' fill='%23fff'%3ENV%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="{{ path_for('/static/vendor/fontawesome/css/fontawesome.min.css') }}?v=7.3.0">
    <link rel="stylesheet" href="{{ path_for('/static/vendor/fontawesome/css/solid.min.css') }}?v=7.3.0">
    <link rel="stylesheet" href="{{ path_for('/static/styles.css') }}?v={{ asset_version }}">
  </head>
  <body class="{% block body_class %}{% endblock %}{% if user %} with-sidebar{% endif %}">
    <a class="skip-link" href="#app-main">Skip to content</a>
    <div class="top-loader" aria-hidden="true"></div>
    {% if user %}
    <aside class="app-sidebar" aria-label="NetVault navigation">
      <a class="sidebar-icon sidebar-logo" href="{{ path_for('/web') }}" data-tooltip="NetVault v{{ app_version }}" aria-label="NetVault home, version {{ app_version }}">
        <i class="fa-solid fa-quote-left" aria-hidden="true"></i>
      </a>
      <nav class="sidebar-nav" aria-label="Main navigation">
        <a class="sidebar-icon {% if request.url.path == '/web' %}active{% endif %}" href="{{ path_for('/web') }}" {% if request.url.path == '/web' %}aria-current="page"{% endif %} data-tooltip="Home" aria-label="Home"><i class="fa-solid fa-chart-column fa-fw" aria-hidden="true"></i></a>
        <a class="sidebar-icon {% if request.url.path == '/web/pdfs' %}active{% endif %}" href="{{ path_for('/web/pdfs') }}" {% if request.url.path == '/web/pdfs' %}aria-current="page"{% endif %} data-tooltip="Search" aria-label="Search"><i class="fa-solid fa-magnifying-glass fa-fw" aria-hidden="true"></i></a>
        <a class="sidebar-icon {% if request.url.path == '/web/cli' %}active{% endif %}" href="{{ path_for('/web/cli') }}" {% if request.url.path == '/web/cli' %}aria-current="page"{% endif %} data-tooltip="CLI" aria-label="CLI"><i class="fa-solid fa-terminal fa-fw" aria-hidden="true"></i></a>
        {% if user.role.value == "admin" %}
        <a class="sidebar-icon {% if request.url.path == '/web/admin' %}active{% endif %}" href="{{ path_for('/web/admin') }}" {% if request.url.path == '/web/admin' %}aria-current="page"{% endif %} data-tooltip="Admin" aria-label="Admin"><i class="fa-solid fa-user-shield fa-fw" aria-hidden="true"></i></a>
        {% endif %}
      </nav>
      <div class="sidebar-bottom">
        <button type="button" class="sidebar-icon theme-toggle" data-theme-toggle aria-label="Switch to dark theme" aria-pressed="false"><i class="fa-solid fa-moon fa-fw" aria-hidden="true"></i></button>
        <a class="sidebar-icon {% if request.url.path == '/web/info' %}active{% endif %}" href="{{ path_for('/web/info') }}" {% if request.url.path == '/web/info' %}aria-current="page"{% endif %} data-tooltip="Help" aria-label="Help"><i class="fa-solid fa-circle-question fa-fw" aria-hidden="true"></i></a>
        <span class="sidebar-icon sidebar-account" data-tooltip="Signed in as {{ user.username }}" aria-label="Signed in as {{ user.username }}"><i class="fa-solid fa-circle-user fa-fw" aria-hidden="true"></i></span>
        <form method="post" action="{{ path_for('/web/logout') }}" class="sidebar-logout">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button class="sidebar-icon" type="submit" data-tooltip="Logout all sessions" aria-label="Logout all sessions"><i class="fa-solid fa-arrow-right-from-bracket fa-fw" aria-hidden="true"></i></button>
        </form>
      </div>
    </aside>
    {% else %}
    <header class="topbar login-topbar">
      <a class="brand" href="{{ path_for('/web') }}">
        <span class="brand-mark"><i class="fa-solid fa-quote-left" aria-hidden="true"></i></span>
        <span class="brand-text">NetVault<small class="brand-version">v{{ app_version }}</small></span>
      </a>
    </header>
    {% endif %}
    {% if not user %}<div class="theme-toggle-floating"><button type="button" class="sidebar-icon theme-toggle" data-theme-toggle aria-label="Switch to dark theme" aria-pressed="false"><i class="fa-solid fa-moon fa-fw" aria-hidden="true"></i></button></div>{% endif %}
    <main class="page" id="app-main" tabindex="-1">
      <h1 class="sr-only">{% block heading %}NetVault{% endblock %}</h1>
      {% block content %}{% endblock %}
    </main>
    <script src="{{ path_for('/static/app.js') }}?v={{ asset_version }}" defer></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
